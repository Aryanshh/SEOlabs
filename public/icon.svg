<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7" />
      <stop offset="100%" stop-color="#F5F5F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Radar Pulse Rings -->
  <circle cx="256" cy="256" r="180" stroke="#E7E5E4" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" stroke="#BBF7D0" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="80" stroke="#10B981" stroke-width="10" opacity="0.4" />

  <!-- Glowing Search Node / Radar Center -->
  <circle cx="256" cy="256" r="64" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="24" fill="#FFFFFF" />

  <!-- Orbiting SERP Signal Node -->
  <circle cx="386" cy="190" r="18" fill="#10B981" />
  <circle cx="386" cy="190" r="8" fill="#FFFFFF" />
  <path d="M 256 256 L 386 190" stroke="#10B981" stroke-width="4" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Orbiting AI Citation Node -->
  <circle cx="160" cy="350" r="14" fill="#F59E0B" />
  <path d="M 256 256 L 160 350" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" opacity="0.6" />
</svg>